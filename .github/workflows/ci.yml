name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -s bash enddayd.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats
        # グローバル導入は runner によって /usr/local の権限が違い、ubuntu では
        # man ページの配置で EACCES になる。ホーム配下の prefix なら両方で通る。
        run: |
          npm install -g --prefix "$HOME/.local" bats@1.13.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run tests
        run: ./tests/run.sh

  # macOS の bash は 3.2 なので、そこでも構文と挙動が通ることを確認する
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check with system bash
        run: /bin/bash -n enddayd.sh
      - name: plist generation
        run: |
          /bin/bash enddayd.sh plist > /tmp/out.plist
          plutil -lint /tmp/out.plist
      - name: install bats
        # グローバル導入は runner によって /usr/local の権限が違い、ubuntu では
        # man ページの配置で EACCES になる。ホーム配下の prefix なら両方で通る。
        run: |
          npm install -g --prefix "$HOME/.local" bats@1.13.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run tests
        run: ./tests/run.sh

      # メニューバーアプリ。設定の解釈がデーモンと食い違うと
      # 「画面では正常なのに走らない」になるので、そこを守る。
      - name: menubar tests
        run: ./menubar/tests/run.sh
      - name: menubar build
        run: ./menubar/build.sh
